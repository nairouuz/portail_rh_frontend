<div class="app-layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <i class="fas fa-building"></i>
        <span>Portail RH</span>
      </div>
    </div>
    
    <nav class="sidebar-nav">
      
      <!-- MENU POUR EMPLOYÉ SEULEMENT -->
      <ng-container *ngIf="isEmploye()">
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
          <i class="fas fa-chart-line"></i>
          <span>Dashboard</span>
        </a>
        <a routerLink="/conges" routerLinkActive="active" class="nav-item">
          <i class="fas fa-umbrella-beach"></i>
          <span>Mes congés</span>
        </a>
        <a routerLink="/prets" routerLinkActive="active" class="nav-item">
          <i class="fas fa-hand-holding-usd"></i>
          <span>Mes prêts</span>
        </a>
        <a routerLink="/avances" routerLinkActive="active" class="nav-item">
          <i class="fas fa-money-bill-wave"></i>
          <span>Mes avances</span>
        </a>
        <a routerLink="/autorisations" routerLinkActive="active" class="nav-item">
          <i class="fas fa-file-alt"></i>
          <span>Mes autorisations</span>
        </a>
        <a routerLink="/documents" routerLinkActive="active" class="nav-item">
          <i class="fas fa-folder-open"></i>
          <span>Documents</span>
        </a>
        <a routerLink="/profil" routerLinkActive="active" class="nav-item">
          <i class="fas fa-user-circle"></i>
          <span>Mon dossier</span>
        </a>
      </ng-container>

      <!-- MENU POUR CHEF SEULEMENT -->
      <ng-container *ngIf="isChef()">
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
          <i class="fas fa-chart-line"></i>
          <span>Dashboard</span>
        </a>
        <a routerLink="/chef/demandes" routerLinkActive="active" class="nav-item">
          <i class="fas fa-clipboard-list"></i>
          <span>Demandes à valider</span>
        </a>
        <a routerLink="/documents" routerLinkActive="active" class="nav-item">
          <i class="fas fa-folder-open"></i>
          <span>Documents</span>
        </a>
        <a routerLink="/profil" routerLinkActive="active" class="nav-item">
          <i class="fas fa-user-circle"></i>
          <span>Mon profil</span>
        </a>
      </ng-container>

      <!-- MENU POUR ADMIN SEULEMENT -->
      <ng-container *ngIf="isAdmin()">
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
          <i class="fas fa-chart-line"></i>
          <span>Dashboard</span>
        </a>
        <a routerLink="/admin/demandes" routerLinkActive="active" class="nav-item">
          <i class="fas fa-clipboard-list"></i>
          <span>Toutes les demandes</span>
        </a>
        <a routerLink="/documents" routerLinkActive="active" class="nav-item">
          <i class="fas fa-folder-open"></i>
          <span>Documents</span>
        </a>
        <a routerLink="/profil" routerLinkActive="active" class="nav-item">
          <i class="fas fa-user-circle"></i>
          <span>Mon profil</span>
        </a>
      </ng-container>

    </nav>
    
    <div class="sidebar-footer">
      <div class="user-info">
        <div class="user-avatar">
          <span>{{ user?.prenom?.[0] }}{{ user?.nom?.[0] }}</span>
        </div>
        <div class="user-details">
          <span class="user-name">{{ user?.prenom }} {{ user?.nom }}</span>
          <span class="user-role">{{ getRoleLabel() }}</span>
        </div>
      </div>
      <button class="logout-btn" (click)="logout()">
        <i class="fas fa-sign-out-alt"></i>
        <span>Déconnexion</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main-content">
    <router-outlet></router-outlet>
  </div>
</div>
