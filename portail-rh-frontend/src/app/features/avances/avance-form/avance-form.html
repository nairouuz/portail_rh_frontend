<div class="form-container">
  <div class="form-header">
    <div class="header-title">
      <h2>Nouvelle demande d'avance</h2>
      <p>Remplissez le formulaire ci-dessous</p>
    </div>
    <button class="btn-retour" (click)="retour()">
      <i class="fas fa-arrow-left"></i>
      Retour
    </button>
  </div>

  <form (ngSubmit)="onSubmit()" #avanceForm="ngForm">

    <div class="form-group">
      <label>
        <i class="fas fa-money-bill-wave"></i>
        Montant (DT) *
      </label>
      <input
        type="number"
        name="montant"
        [(ngModel)]="demande.montant"
        required
        min="1"
        class="form-control"
        placeholder="Ex: 500">
    </div>

    <div class="form-group">
      <label>
        <i class="fas fa-file-alt"></i>
        Motif *
      </label>
      <textarea
        name="motif"
        [(ngModel)]="demande.motif"
        required
        rows="4"
        class="form-control"
        placeholder="Décrivez le motif de votre avance..."></textarea>
    </div>

    <div *ngIf="errorMessage" style="color: red; margin-bottom: 10px;">
      {{ errorMessage }}
    </div>

    <div class="form-actions">
      <button type="button" class="btn-annuler" (click)="retour()">
        <i class="fas fa-times"></i>
        Annuler
      </button>
      <button type="submit" class="btn-submit" [disabled]="!avanceForm.valid">
        <i class="fas fa-paper-plane"></i>
        Soumettre
      </button>
    </div>

  </form>
</div>
