<div class="form-container">
  <div class="form-header">
    <div class="header-title">
      <h2>Nouvelle demande de congé</h2>
      <p>Remplissez le formulaire ci-dessous</p>
    </div>
    <button class="btn-retour" (click)="retour()">
      <i class="fas fa-arrow-left"></i>
      Retour
    </button>
  </div>

  <form (ngSubmit)="onSubmit()" #congeForm="ngForm">
    <div class="form-group">
      <label>
        <i class="fas fa-calendar-alt"></i>
        Date de début *
      </label>
      <input 
        type="date" 
        name="dateDebut"
        [(ngModel)]="demande.dateDebut"
        required
        class="form-control">
    </div>

    <div class="form-group">
      <label>
        <i class="fas fa-calendar-alt"></i>
        Date de fin *
      </label>
      <input 
        type="date" 
        name="dateFin"
        [(ngModel)]="demande.dateFin"
        required
        class="form-control">
    </div>

    <div class="form-group">
      <label>
        <i class="fas fa-file-alt"></i>
        Motif *
      </label>
      <textarea 
        name="motif"
        [(ngModel)]="demande.motif"
        required
        rows="4"
        class="form-control"
        placeholder="Décrivez le motif de votre congé..."></textarea>
    </div>

    <div *ngIf="errorMessage" style="color: red; margin-bottom: 10px;">
      {{ errorMessage }}
    </div>

    <div class="form-actions">
               <button class="btn-annuler" (click)="retour()">
        Annuler
      </button>
      <button type="submit" class="btn-submit" [disabled]="!congeForm.valid || isLoading">
        <i class="fas fa-paper-plane"></i>
        {{ isLoading ? 'Envoi en cours...' : 'Soumettre' }}
      </button>
    </div>
  </form>
</div>
